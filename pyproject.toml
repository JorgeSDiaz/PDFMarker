[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfmarker-watermark"
dynamic = ["version"]
description = "Apply text and image watermarks to PDF files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jorge David Saenz Diaz" },
]
keywords = ["pdf", "watermark", "pypdf", "reportlab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Pillow>=10.0",
    "pypdf>=5.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/JorgeSDiaz/PDFMarker"
Repository = "https://github.com/JorgeSDiaz/PDFMarker"
Issues = "https://github.com/JorgeSDiaz/PDFMarker/issues"

[project.scripts]
pdfmarker-watermark = "pdfmarker.infrastructure.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pdfmarker.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfmarker*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
